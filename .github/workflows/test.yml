name: tests

on:
  push:
  pull_request:

jobs:
  prediction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fatigue model regression tests
        run: node --test test/prediction.test.js
